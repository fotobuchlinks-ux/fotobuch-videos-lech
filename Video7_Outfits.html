<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Video</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

/* Fullscreen Video */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  background: black;
}

/* Start-Overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.25);
  z-index: 10;
}

.playbutton {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  cursor: pointer;
  user-select: none;
}

/* Kleine Steuer-Hinweise (optional UX) */
.hint {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="video" playsinline>
  <source src="Video7_Outfits.mp4" type="video/mp4">
</video>

<!-- START BUTTON -->
<div class="overlay" id="overlay">
  <div class="playbutton" id="btn">▶</div>
</div>

<div class="hint">Tippe zum Starten / Pausieren</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');

// Start Video
overlay.addEventListener('click', () => {
  overlay.style.display = "none";
  video.play();
});

// Pause / Play durch Tippen aufs Video
video.addEventListener('click', () => {
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
});

// Wenn Video endet → wieder startbereit machen
video.addEventListener('ended', () => {
  overlay.style.display = "flex";
  video.currentTime = 0;
});

// Optional: Autoplay versuchen (wird oft blockiert)
window.addEventListener('load', () => {
  video.muted = false;
});
</script>

</body>
</html>
