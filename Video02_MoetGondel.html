<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Video</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* -------------------- */
/* VIDEO */
/* -------------------- */

video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:black;
}

/* Hochformat */
@media (orientation:portrait){

video{
    object-fit:contain;
}

}

/* Querformat */
@media (orientation:landscape){

video{
    object-fit:cover;
}

}

/* -------------------- */
/* PLAY OVERLAY */
/* -------------------- */

#overlay{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.25);

    cursor:pointer;

    transition:.3s;

    z-index:1000;

}

#overlay.hidden{

    opacity:0;
    visibility:hidden;

}

.playButton{

    width:95px;
    height:95px;

    border-radius:50%;

    background:rgba(255,255,255,.92);

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:42px;

    user-select:none;

    transition:.2s;

}

.playButton:hover{

    transform:scale(1.08);

}

/* -------------------- */
/* HINWEIS */
/* -------------------- */

#hint{

    position:fixed;

    bottom:25px;

    left:0;

    width:100%;

    text-align:center;

    color:white;

    font-size:14px;

    opacity:.75;

    transition:.4s;

    z-index:500;

}

#hint.hidden{

    opacity:0;

}

/* -------------------- */
/* REPLAY BUTTON */
/* -------------------- */

#replay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.45);

    z-index:900;

}

#replay button{

    font-size:22px;

    padding:18px 34px;

    border:none;

    border-radius:40px;

    cursor:pointer;

}

</style>

</head>

<body>

<!-- VIDEO -->

<video id="video" playsinline>

<source src="Video2_MoetGondel.mp4" type="video/mp4">

Dein Browser unterstützt dieses Video nicht.

</video>

<!-- PLAY BUTTON -->

<div id="overlay">

<div class="playButton">

▶

</div>

</div>

<!-- HINWEIS -->

<div id="hint">

Tippe auf das Video zum Pausieren oder Fortsetzen

</div>

<!-- REPLAY -->

<div id="replay">

<button>Noch einmal ansehen ▶</button>

</div>

<script>

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const replay=document.getElementById("replay");
const hint=document.getElementById("hint");

overlay.onclick=()=>{

overlay.classList.add("hidden");

hint.classList.add("hidden");

video.play();

}

video.onclick=()=>{

if(video.paused){

video.play();

}

else{

video.pause();

}

}

video.onended=()=>{

video.currentTime=0;

replay.style.display="flex";

}

replay.onclick=()=>{

replay.style.display="none";

video.play();

}

</script>

</body>
</html>
